services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: sharebondhu
      POSTGRES_USER: sharebondhu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a development password with npm run setup:dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sharebondhu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharebondhu -d sharebondhu"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sharebondhu_postgres:
